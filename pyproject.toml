[project]
name = "fly-in"
version = "0.1.0"
description = "An efficient drone routing system that navigates multiple drones through connected zones."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
fly-in = "fly_in:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
